<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO 최적화: 타이틀 변경 및 설명 메타 태그 -->
  <title>나의 첫 서비스</title>
  <meta name="description" content="격려와 긍정의 메시지를 전하는 나만의 첫 번째 웹 서비스입니다.">
  
  <!-- 외부 폰트 연동 (Outfit & Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- 스타일시트 연동 (캐시 버스팅을 위한 버전 v=10 설정) -->
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>

  <!-- 뒷배경 유영하는 그라데이션 광원 구체들 -->
  <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-2" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-3" aria-hidden="true"></div>

  <!-- [헤더 구역]: 파란색 배경 적용 및 서비스 제목 배치 -->
  <header id="app-header">
    <div class="header-content">
      <span class="header-logo">🔵 나의 첫 서비스</span>
    </div>
  </header>

  <!-- [본문 구역]: 기존의 힐링 문장과 전환 버튼을 수용하며 중앙 정렬 -->
  <main id="app-container">
    
    <!-- 3D Tilt 효과 및 입체 테두리를 내장한 라이트 글래스 카드 -->
    <div class="card" id="main-card">
      <!-- 텍스트 영역: 고정 40px 및 다크 톤 텍스트 -->
      <h1 id="main-sentence">오늘도 힘내세요!</h1>
      
      <!-- 클릭 시 테마색 순환 및 문구 페이드 전환 버튼 -->
      <button id="btn-next" class="btn-primary">
        다음 문장보기
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
    
  </main>

  <!-- [푸터 구역]: 회색 배경 적용 및 카피라이트 배치 -->
  <footer id="app-footer">
    <div class="footer-content">
      <p>&copy; 2026 my service</p>
    </div>
  </footer>

  <!-- 자바스크립트 연동 (v=10으로 갱신) -->
  <script src="script.js?v=10"></script>
</body>
</html>
